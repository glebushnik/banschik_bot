[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banschik-bot"
version = "0.1.0"
description = "Telegram group assistant with local semantic memory"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.9,<2",
  "fastembed>=0.7,<0.9",
  "APScheduler>=3.11,<4",
  "python-dotenv>=1,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
banschik = "banschik.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["banschik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
